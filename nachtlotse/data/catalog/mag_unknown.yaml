# Objects with no reliably sourced integrated magnitude at all — see
# SKIPPED-OBJECTS.md for the researched, per-object reasoning (mostly
# diffuse emission/dark nebulae and Abell planetary nebulae, which
# essentially never get one published). See catalog/__init__.py for the
# schema; unlike every other mag_*.yaml file, entries here omit
# `magnitude` entirely rather than bounding it to a numeric range —
# `size_arcmin` is mandatory instead, since that's what framing actually
# needs and magnitude can't provide here.
#
# Populated block by block (2026-09-15 onward) from the ~50 candidates
# identified in SKIPPED-OBJECTS.md — real OpenNGC/SIMBAD-sourced
# coordinates and sizes, not fabricated, the same rigor as every other
# entry in this catalog. Not sorted by anything in particular (there's no
# magnitude to sort by) — roughly import order.

- name: "Antares Nebula"
  catalog_id: "IC 4606"
  aliases: ["LBN 1107"]
  ra_deg: 247.25
  dec_deg: -26.6
  # SIMBAD: HII Region, quality flag E (>=10" uncertain, still well inside
  # this project's ~1' precision need); no NGC 6144 confusion in the
  # current record (see SKIPPED-OBJECTS.md's 2026-09-15 recheck). Size
  # from French Wikipedia (SIMBAD/OpenNGC carry none).
  size_arcmin: [60.0, 40.0]
  types: ["emission_nebula", "reflection_nebula"]

- name: "Spaghetti Nebula"
  catalog_id: "Sh2-240"
  aliases: ["Simeis 147", "LBN 180.05-01.66"]
  ra_deg: 85.275
  dec_deg: 28.083
  # SIMBAD: HII Region (supernova remnant by common usage — this project
  # has no dedicated SNR type). Size (~3 degrees) corroborated across
  # Wikipedia, APOD, and the original Sharpless (1959) catalog value.
  size_arcmin: [180.0, 180.0]
  types: ["emission_nebula"]

