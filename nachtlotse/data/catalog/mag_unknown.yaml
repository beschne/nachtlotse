# Block 12 (2026-09-20): NGC 6874, previously listed in SKIPPED-OBJECTS.md
# under "not real, catalogable objects" alongside IC 1316 — a recheck
# prompted by user-supplied German Wikipedia/OpenNGC sources found that
# was wrong for this one: unlike IC 1316 (OpenNGC/NED: "nothing here,
# nominal position" at that coordinate, reconfirmed again this pass — a
# real absence, correctly still excluded), NGC 6874 does have a real,
# citable position (German Wikipedia and OpenNGC's own NGC.csv agree:
# RA 20:07:33.08, Dec +38:14:46.0) and a real size (7.0', German
# Wikipedia) — it just has no sourced magnitude anywhere (OpenNGC's
# B/V/J/H/K-Mag fields are all empty for this row) and an ambiguous type:
# OpenNGC classifies it "*Ass" (stellar association), SIMBAD "Object of
# Unknown Nature", while German Wikipedia and Bracken's own listing call
# it an open cluster (Trumpler type IV1m). A single Flickr caption claims
# "mag 7.7" but isn't a citable source and isn't corroborated anywhere
# else, so it isn't used. `types: ["open_cluster"]` follows the same
# "lack of a better bucket" precedent as M73's entry (mag_9_10.yaml)
# rather than introducing a stellar-association category for one object.

- name: "NGC 6874"
  catalog_id: "NGC 6874"
  ra_deg: 301.888
  dec_deg: 38.246
  size_arcmin: [7.0, 7.0]
  types: ["open_cluster"]
