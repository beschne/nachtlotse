  # with star involved") is the same star-conflation pattern as the
  # other entries in this block, not a real nebula magnitude.
  size_arcmin: [32.0, 32.0]
  types: ["reflection_nebula"]

- name: "Gamma Cygni Nebula"
  catalog_id: "IC 1318"
  aliases: ["LBN 245"]
  # SIMBAD's own "IC 1318" position (20 16 48 +41 57 24) sits ~1.7 deg from
  # every other source for this object; Deep Sky Corner's coordinates
  # (used here) are centered on Gamma Cygni (Sadr) itself, which the
  # nebula complex surrounds — using them paired with its own size figure
  # keeps the position and the framing size self-consistent, rather than
  # mixing a size measured relative to one center onto a different one.
  ra_deg: 305.558
  dec_deg: 40.257
  # "IC 1318b" (an informal sub-region label for part of this same
  # complex) isn't a separate catalog entry — it has no catalog
  # designation or sourcing of its own beyond this object (see
  # SKIPPED-OBJECTS.md).
  size_arcmin: [50.0, 30.0]
  types: ["emission_nebula"]

