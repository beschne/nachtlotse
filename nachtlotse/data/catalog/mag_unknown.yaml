- name: "Reflection Nebula IC 444"
  catalog_id: "IC 444"
  aliases: ["vdB 75", "Ced 74", "DG 100"]
  ra_deg: 94.642
  dec_deg: 23.313
  # SKIPPED-OBJECTS.md previously listed this as "vdB 75 (Foxfur Nebula)"
  # — a mislabeling caught during this recheck: the real Foxfur Nebula is
  # a different object entirely (Sh2-273, part of NGC 2264 in Monoceros).
