# Template for your observing-site list.
#
# This file is NOT read by Nachtlotse (see store.py) — it's an example to
# copy from:
#
#   cp nachtlotse/data/sites_local.template.yaml nachtlotse/data/sites_local.yaml
#
# Edit the copy freely: replace these two examples with your own sites, or
# keep them and add more. `sites_local.yaml` is gitignored — your sites
# never get committed. The first entry in your file becomes the default
# site for `lotse plan` when you don't pass --site.
#
# Fields:
#   name, lat_deg, lon_deg, elevation_m   required
#   tz                                    optional, default "Europe/Berlin"
#   region, bortle, address, aliases      optional, for `lotse sites` display
#   horizon_points: [[az_deg, alt_deg], ...]
#     Measured horizon — minimum altitude by azimuth, linearly interpolated
#     (wraps at 360°/0°). Use this if you've actually surveyed the site.
#   sector: [start_deg, end_deg]  or  [start_deg, end_deg, min_alt_deg]
#     Shorthand for "only this clockwise arc is open sky" (wraps past 360°
#     if start > end); everything outside becomes a 90° wall. min_alt_deg
#     (default 0°) is the minimum altitude within the open arc.
#   Omit both horizon_points and sector for an unrestricted 360° view.

