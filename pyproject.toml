[project]
name = "nachtlotse"
version = "1.1.0"
description = "Deterministic astrophotography session planner: scores sky, site, and equipment into a shortlist with a GO/MARGINAL/SKIP verdict per target"
requires-python = ">=3.12"
dependencies = [
    "astroplan>=0.10.1",
    "astropy>=8.0.1",
    "numpy>=2.5.3",
    "pyyaml>=6.0.3",
    "skyfield>=1.55",
]

[project.optional-dependencies]
# The UI is deliberately swappable (see CLAUDE.md); streamlit is the M5
# MVP, not a core dependency of the engine/CLI. Install with `uv sync
# --extra ui` before `uv run streamlit run nachtlotse/ui/app.py`.
ui = [
    "streamlit>=1.51.0",
    "altair>=5.0.0",
]

[project.scripts]
lotse = "nachtlotse.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
filterwarnings = [
    # Benign third-party noise, not actionable from this codebase.
    "ignore::astropy.coordinates.errors.NonRotationTransformationWarning",
    "ignore:Setting the dtype on a NumPy array:DeprecationWarning:skyfield",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["*.md"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
