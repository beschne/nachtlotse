[project]
name = "nachtlotse"
version = "2.4.0"
description = "Deterministic astrophotography session planner: scores sky, site, and equipment into a shortlist with a GO/MARGINAL/SKIP verdict per target"
requires-python = ">=3.12"
dependencies = [
    "astroplan>=0.10.1",
    "astropy>=8.0.1",
    "numpy>=2.5.3",
    "pyyaml>=6.0.3",
    "skyfield>=1.55",
]

[project.optional-dependencies]
# `lotse plan --chart` PNG export — not a core CLI dependency, so the
# ordinary text-only workflow needs nothing extra. Install with `uv sync
# --extra charts`.
charts = [
    "matplotlib>=3.9",
]
# `lotse plan --prose` nightly briefing (Claude API) — only for phrasing
# the engine's own numbers, never for computing them (see CLAUDE.md's
# Guiding principle). Install with `uv sync --extra prose`.
prose = [
    "anthropic>=0.69",
]

[project.scripts]
lotse = "nachtlotse.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
filterwarnings = [
    # Benign third-party noise, not actionable from this codebase.
    "ignore::astropy.coordinates.errors.NonRotationTransformationWarning",
    "ignore:Setting the dtype on a NumPy array:DeprecationWarning:skyfield",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["*.md"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
